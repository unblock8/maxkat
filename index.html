<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кац смотреть</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ef4444" id="metaTheme">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-hover-bg: rgba(51, 65, 85, 0.8);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
            --header-bg: rgba(15, 23, 42, 0.85);
            --badge-online-bg: rgba(34, 197, 94, 0.15);
            --badge-online-text: #4ade80;
            --badge-offline-bg: rgba(239, 68, 68, 0.15);
            --badge-offline-text: #f87171;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-hover-bg: rgba(255, 255, 255, 1);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent: #ef4444;
            --border: rgba(0, 0, 0, 0.08);
            --header-bg: rgba(241, 245, 249, 0.85);
            --badge-online-bg: #dcfce7;
            --badge-online-text: #15803d;
            --badge-offline-bg: #fee2e2;
            --badge-offline-text: #b91c1c;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        header {
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
        }

        .brand-icon {
            background: var(--accent);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            background: var(--border);
            transition: all 0.3s ease;
        }

        .status-badge.online {
            background: var(--badge-online-bg);
            color: var(--badge-online-text);
        }

        .status-badge.offline {
            background: var(--badge-offline-bg);
            color: var(--badge-offline-text);
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        .online .dot {
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .theme-btn:active {
            transform: scale(0.92);
        }

        main {
            max-width: 580px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .loader-container {
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: block;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s;
        }

        .video-card:hover, .video-card:active {
            transform: translateY(-4px) scale(1.01);
            background: var(--card-hover-bg);
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            overflow: hidden;
        }

        .thumb-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .video-card:hover .thumb-wrapper img {
            transform: scale(1.04);
        }

        .play-btn-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            background: rgba(239, 68, 68, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            opacity: 0.9;
        }

        .play-btn-overlay::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 9px 0 9px 16px;
            border-color: transparent transparent transparent white;
            margin-left: 3px;
        }

        .badge-fresh {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .video-details {
            padding: 18px 20px;
        }

        .video-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            font-size: 0.85rem;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .error-card {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .btn-reload {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="brand">
            <div class="brand-icon">▶</div>
            <span>Кац смотреть</span>
        </div>
        <div class="controls">
            <div id="statusBadge" class="status-badge">
                <span class="dot"></span>
                <span id="statusText">Проверка...</span>
            </div>
            <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <main id="app">
        <div class="loader-container">
            <div class="spinner"></div>
            <div id="loadingStatus">Проверяем доступность YouTube (1/3)...</div>
        </div>
    </main>

    <script>
        const CHANNEL_ID = 'UCp6iZbz0W-zWdE6sEwX4QEQ';

        function initTheme() {
            const saved = localStorage.getItem('kats_theme') || 'dark';
            setTheme(saved);
        }

        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            document.getElementById('themeBtn').innerText = theme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('kats_theme', theme);
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        initTheme();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        async function checkYouTube() {
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            const loadingStatus = document.getElementById('loadingStatus');

            for (let i = 1; i <= 3; i++) {
                if (loadingStatus) loadingStatus.innerText = `Проверяем доступность YouTube (${i}/3)...`;
                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 5000);

                    await fetch('https://www.youtube.com/favicon.ico', {
                        mode: 'no-cors',
                        signal: controller.signal
                    });

                    clearTimeout(timer);
                    statusBadge.className = 'status-badge online';
                    statusText.innerText = 'YouTube Онлайн';
                    return true;
                } catch (e) {
                    await new Promise(r => setTimeout(r, 500));
                }
            }

            statusBadge.className = 'status-badge offline';
            statusText.innerText = 'YouTube Оффлайн';
            return false;
        }

        function timeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const sec = Math.floor((now - date) / 1000);

            if (isNaN(sec)) return 'Недавно';
            if (sec < 60) return 'Только что';
            
            const min = Math.floor(sec / 60);
            if (min < 60) return `${min} ${declension(min, ['минуту', 'минуты', 'минут'])} назад`;
            
            const hours = Math.floor(min / 60);
            if (hours < 24) return `${hours} ${declension(hours, ['час', 'часа', 'часов'])} назад`;
            
            const days = Math.floor(hours / 24);
            if (days < 30) return `${days} ${declension(days, ['день', 'дня', 'дней'])} назад`;

            return date.toLocaleDateString('ru-RU');
        }

        function declension(n, titles) {
            return titles[(n % 100 > 4 && n % 100 < 20) ? 2 : [2, 0, 1, 1, 1, 2][(n % 10 < 5) ? n % 10 : 5]];
        }

        // Парсинг чистого XML текста в массив элементов
        function parseXmlToItems(xmlText) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlText, "text/xml");
            const entries = xml.querySelectorAll("entry");
            const items = [];

            entries.forEach(entry => {
                const title = entry.querySelector("title")?.textContent || "Видео";
                const published = entry.querySelector("published")?.textContent || "";
                const linkEl = entry.querySelector("link");
                const videoUrl = linkEl ? linkEl.getAttribute("href") : "";
                const match = videoUrl.match(/[?&]v=([^&]+)/);
                const videoId = match ? match[1] : "";

                if (videoId) {
                    items.push({ title, published, videoUrl, videoId });
                }
            });

            return items;
        }

        // Автоматический ротатор источников с фолбеком
        async function loadFeedData() {
            const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
            
            const sources = [
                // Источник 1: Invidious API
                async () => {
                    const res = await fetch(`https://inv.tux.pizza/api/v1/channels/${CHANNEL_ID}/videos`);
                    const data = await res.json();
                    return data.slice(0, 2).map(v => ({
                        title: v.title,
                        published: new Date(v.published * 1000).toISOString(),
                        videoUrl: `https://www.youtube.com/watch?v=${v.videoId}`,
                        videoId: v.videoId
                    }));
                },
                // Источник 2: CORSProxy
                async () => {
                    const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(rssUrl)}`);
                    const xmlText = await res.text();
                    return parseXmlToItems(xmlText);
                },
                // Источник 3: AllOrigins
                async () => {
                    const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`);
                    const xmlText = await res.text();
                    return parseXmlToItems(xmlText);
                }
            ];

            for (const getSource of sources) {
                try {
                    const items = await getSource();
                    if (items && items.length > 0) return items;
                } catch (e) {
                    console.warn("Источник отломился, пробуем следующий...", e);
                }
            }

            throw new Error("Все источники недоступны");
        }

        async function fetchVideos() {
            const main = document.getElementById('app');
            const isOnline = await checkYouTube();

            if (!isOnline) {
                main.innerHTML = `
                    <div class="error-card">
                        <h3>YouTube недоступен</h3>
                        <p style="color: var(--text-sub)">Не удалось связаться с серверами после 3 попыток.</p>
                        <button class="btn-reload" onclick="fetchVideos()">Повторить попытку</button>
                    </div>
                `;
                return;
            }

            document.getElementById('loadingStatus').innerText = 'Загрузка свежих видео...';

            try {
                const items = await loadFeedData();
                let html = '';
                const limit = Math.min(items.length, 2);

                for (let i = 0; i < limit; i++) {
                    const item = items[i];
                    const thumbUrl = `https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg`;
                    const relTime = timeAgo(item.published);
                    const isFresh = (new Date() - new Date(item.published)) < (12 * 3600 * 1000);

                    html += `
                        <a href="${item.videoUrl}" target="_blank" rel="noopener" class="video-card">
                            <div class="thumb-wrapper">
                                <img src="${thumbUrl}" alt="${item.title}" loading="lazy">
                                <div class="play-btn-overlay"></div>
                                ${isFresh ? '<div class="badge-fresh">Свежее</div>' : ''}
                            </div>
                            <div class="video-details">
                                <h2 class="video-title">${item.title}</h2>
                                <div class="video-meta">
                                    <span>🕒</span>
                                    <span>${relTime}</span>
                                </div>
                            </div>
                        </a>
                    `;
                }

                main.innerHTML = html;

            } catch (err) {
                console.error(err);
                main.innerHTML = `
                    <div class="error-card">
                        <h3>Ошибка загрузки ленты</h3>
                        <p style="color: var(--text-sub)">Не удалось получить список видео. Проверьте соединение.</p>
                        <button class="btn-reload" onclick="fetchVideos()">Попробовать снова</button>
                    </div>
                `;
            }
        }

        fetchVideos();
    </script>
</body>
</html>
